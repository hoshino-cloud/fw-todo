<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>カレンダー</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <main class="container">
        <h1 class="page-title">カレンダー</h1>

        <nav class="calendar-navigation" aria-label="月の移動">
            <div class="calendar-navigation-months">
                <a class="link" th:href="@{/calendar(year=${previousMonth.year}, month=${previousMonth.monthValue})}">前の月</a>
                <a class="link" th:href="@{/calendar(year=${nextMonth.year}, month=${nextMonth.monthValue})}">次の月</a>
            </div>
            <h2 class="calendar-heading" th:text="${displayedMonth.year + '年' + displayedMonth.monthValue + '月'}">2026年4月</h2>
            <div class="calendar-navigation-actions">
                <a class="link" href="/todos">表で見る</a>
                <a class="link" href="/todos/new">新規登録</a>
            </div>
        </nav>

        <table class="calendar-table" th:attr="data-from=${firstDay}, data-to=${lastDay}">
            <thead>
                <tr>
                    <th scope="col">日</th>
                    <th scope="col">月</th>
                    <th scope="col">火</th>
                    <th scope="col">水</th>
                    <th scope="col">木</th>
                    <th scope="col">金</th>
                    <th scope="col">土</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="week : ${weeks}">
                    <th:block th:each="day : ${week}">
                        <td th:if="${day != null}" th:attr="data-date=${day}">
                            <span th:text="${day.dayOfMonth}">1</span>
                        </td>
                        <td th:unless="${day != null}" class="calendar-empty"></td>
                    </th:block>
                </tr>
            </tbody>
        </table>
    </main>
    <script>
        async function loadTodos() {
            const calendar = document.querySelector('.calendar-table');
            const from = calendar.dataset.from;
            const to = calendar.dataset.to;
            const res = await fetch(`/api/todos?from=${from}&to=${to}`);
            const todos = await res.json();

            const today = new Date();
            const todayText = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
            const todosByDate = new Map();

            todos.forEach((todo) => {
                const dayTodos = todosByDate.get(todo.dueDate) || [];
                dayTodos.push(todo);
                todosByDate.set(todo.dueDate, dayTodos);
            });

            todosByDate.forEach((dayTodos, dueDate) => {
                const dayCell = document.querySelector(`td[data-date="${dueDate}"]`);
                if (!dayCell) {
                    return;
                }

                dayTodos.slice(0, 3).forEach((todo) => {
                    const todoTitle = document.createElement('a');
                    todoTitle.textContent = todo.title;
                    todoTitle.href = `/todos/${todo.id}/edit`;

                    if (todo.dueDate < todayText && !todo.completed) {
                        todoTitle.style.color = 'red';
                    }

                    dayCell.append(todoTitle);
                });

                if (dayTodos.length > 3) {
                    const remainingCount = document.createElement('div');
                    remainingCount.textContent = `ほか ${dayTodos.length - 3}件`;
                    dayCell.append(remainingCount);
                }
            });
        }

        async function loadHolidays() {
            const calendar = document.querySelector('.calendar-table');
            const from = calendar.dataset.from;
            const to = calendar.dataset.to;
            const res = await fetch(`/api/holidays?from=${from}&to=${to}`);

            if (res.headers.has('X-Holidays-Unavailable')) {
                const message = document.createElement('p');
                message.textContent = '祝日を取れませんでした';
                document.querySelector('main').prepend(message);
            }

            const holidays = await res.json();

            document.querySelectorAll('td[data-date]').forEach((dayCell) => {
                const date = dayCell.dataset.date;
                const dayOfWeek = new Date(`${date}T00:00:00`).getDay();

                if (dayOfWeek === 6) {
                    dayCell.style.backgroundColor = '#e6f3ff';
                } else if (dayOfWeek === 0) {
                    dayCell.style.backgroundColor = '#ffe6e6';
                }

                if (holidays[date]) {
                    dayCell.style.backgroundColor = '#fff4cc';
                    dayCell.title = holidays[date];
                }
            });
        }

        loadTodos();
        loadHolidays();
    </script>
</body>

</html>
