<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>やること一覧</title>
    <link rel="stylesheet" href="/css/style.css?v=overdue">
</head>

<body>
    <main class="container">
        <h1 class="page-title">やること一覧</h1>

        <p class="flash" th:if="${message}" th:text="${message}"></p>

        <div class="search-bar">
            <form action="/todos" method="get">
                <input type="hidden" name="order" th:value="${order}">
                <input type="hidden" name="trash" th:value="${trash}">
                <input type="hidden" name="page" value="1">
                <label for="keyword">やること</label>
                <input id="keyword" type="text" name="keyword" th:value="${keyword}">
                <label for="category">ジャンル</label>
                <select id="category" name="category">
                    <option value="" th:selected="${category == ''}">すべて</option>
                    <option value="デザイン" th:selected="${category == 'デザイン'}">デザイン</option>
                    <option value="マーケティング" th:selected="${category == 'マーケティング'}">マーケティング</option>
                    <option value="プログラミング" th:selected="${category == 'プログラミング'}">プログラミング</option>
                    <option value="資格" th:selected="${category == '資格'}">資格</option>
                    <option value="就職活動" th:selected="${category == '就職活動'}">就職活動</option>
                </select>
                <input id="includeCompleted" type="checkbox" name="includeCompleted" value="true"
                    th:checked="${includeCompleted}">
                <label for="includeCompleted">完了したものも表示する</label>
                <button class="btn" type="submit">絞り込む</button>
            </form>
            <a class="link" th:href="@{/todos(keyword=${keyword}, category=${category}, order='asc', includeCompleted=${includeCompleted}, trash=${trash})}">期限が近い順</a>
            <a class="link" th:href="@{/todos(keyword=${keyword}, category=${category}, order='desc', includeCompleted=${includeCompleted}, trash=${trash})}">期限が遠い順</a>
            <a class="link" th:href="@{/api/todos.csv(keyword=${keyword}, category=${category}, order=${order}, includeCompleted=${includeCompleted}, trash=${trash})}">CSVを書き出す</a>
        </div>

        <a class="btn" href="/todos/new">新規登録</a>
        <a class="link" href="/calendar">カレンダーで見る</a>
        <a class="link" th:if="${!trash}" href="/todos?trash=1">削除したものを見る</a>
        <a class="link" th:if="${trash}" href="/todos">一覧に戻る</a>

        <p th:if="${#lists.isEmpty(todos)}">まだ1件も登録されていません</p>

        <table class="todo-table" th:unless="${#lists.isEmpty(todos)}">
            <thead>
                <tr>
                    <th>やること</th>
                    <th>メモ</th>
                    <th>ジャンル</th>
                    <th>優先度</th>
                    <th>期限</th>
                    <th>状態</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="todo : ${todos}"
                    th:classappend="${todo.dueDate != null and todo.dueDate.isBefore(T(java.time.LocalDate).now()) and !todo.completed} ? 'overdue' : ''">
                    <td th:text="${todo.title}">やること</td>
                    <td th:text="${todo.detail}">メモ</td>
                    <td th:text="${todo.category}">ジャンル</td>
                    <td>
                        <span th:text="${todo.priority == 1 ? '高' : todo.priority == 2 ? '中' : '低'}">優先度</span>
                        <span class="priority-high-marker" th:if="${todo.priority == 1}" aria-label="最優先">★</span>
                    </td>
                    <td th:text="${todo.dueDate}">期限</td>
                    <td th:text="${todo.completed ? '完了' : '未完了'}">状態</td>
                    <td th:if="${!trash}"><a class="link" th:href="@{/todos/{id}/edit(id=${todo.id})}">編集</a> <a class="link" th:href="@{/todos/{id}/delete(id=${todo.id})}">削除</a></td>
                    <td th:if="${trash}"><form th:action="@{/todos/{id}/restore(id=${todo.id})}" method="post"><button class="link" type="submit">戻す</button></form></td>
                </tr>
            </tbody>
        </table>
        <nav class="pagination" th:if="${totalPages > 1}" aria-label="ページ番号">
            <a th:each="pageNumber : ${#numbers.sequence(1, totalPages)}"
                th:href="@{/todos(keyword=${keyword}, category=${category}, order=${order}, includeCompleted=${includeCompleted}, trash=${trash}, page=${pageNumber})}"
                th:text="${pageNumber}" th:classappend="${pageNumber == page} ? 'current' : ''">1</a>
        </nav>
    </main>
</body>

</html>
